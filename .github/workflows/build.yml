name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}   # lets you trigger a build manually from the Actions tab

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: NebulaLauncher-windows.zip
            pyinstaller_icon: assets/icon.ico
          - os: macos-latest
            artifact_name: NebulaLauncher-macos.zip
            pyinstaller_icon: assets/icon.icns
          - os: ubuntu-latest
            artifact_name: NebulaLauncher-linux.zip
            pyinstaller_icon: assets/icon.png

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps for Qt (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libxcb-cursor0

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: >
          pyinstaller --noconfirm --windowed --onefile
          --name NebulaLauncher
          --icon "${{ matrix.pyinstaller_icon }}"
          --add-data "assets${{ runner.os == 'Windows' && ';' || ':' }}assets"
          nebula_launcher/main.py

      - name: Package build (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/NebulaLauncher.exe -DestinationPath ${{ matrix.artifact_name }}
        shell: pwsh

      - name: Package build (macOS/Linux)
        if: runner.os != 'Windows'
        run: |
          cd dist
          zip -r ../${{ matrix.artifact_name }} NebulaLauncher* 2>/dev/null || zip -r ../${{ matrix.artifact_name }} NebulaLauncher
          cd ..

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p out
          find artifacts -type f -name "*.zip" -exec cp {} out/ \;
          ls -la out

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.zip
          generate_release_notes: true
